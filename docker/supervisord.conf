; Same programs as auto-install/supervisor, plus Redis. Output goes to the container log.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Nothing is saved to disk: control.py and the web app rebuild what they need from /data on start.
[program:redis]
command=redis-server --save "" --appendonly no --bind 127.0.0.1 --port 6379 --dir /tmp
priority=1
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:control]
command=python /usr/local/bin/pifire/control.py
directory=/usr/local/bin/pifire
environment=SDL_AUDIODRIVER="dummy"
priority=10
autorestart=true
startretries=3
stopasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:webapp]
command=gunicorn -k eventlet -b 0.0.0.0:8000 -w 1 app:app
directory=/usr/local/bin/pifire
priority=10
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[include]
files=/tmp/supervisor.d/*.conf
